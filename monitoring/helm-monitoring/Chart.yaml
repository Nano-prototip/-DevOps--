apiVersion: v2
name: helm-monitoring
description: A Helm chart for deploying kube-prometheus-stack with customizations
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  - name: kube-prometheus-stack
    version: "86.1.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled